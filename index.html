<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>67 TEEN — En maintenance</title>
<link rel="icon" href="favicon.png">
<meta name="robots" content="noindex">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,600&family=Karla:wght@400;600;700&display=swap');
  :root{
    --paper:#F4F5F0; --ink:#20281F; --muted:#5C665A;
    --accent:#E15A2E; --accent-strong:#C6491F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; min-height:100vh; background:var(--paper); color:var(--ink);}
  body{display:flex; align-items:center; justify-content:center; padding:24px; font-family:'Karla', -apple-system, sans-serif; text-align:center;}
  .box{max-width:480px;}
  .brand{font-family:'Fraunces', Georgia, serif; font-weight:700; font-size:2.4rem; margin:0 0 18px;}
  .brand .n{color:var(--accent);}
  h1{font-family:'Fraunces', Georgia, serif; font-style:italic; font-weight:600; font-size:1.5rem; margin:0 0 14px; text-wrap:balance;}
  p{color:var(--muted); font-size:1.05rem; line-height:1.6; margin:0 0 8px;}
  a{color:var(--accent-strong);}
</style>
</head>
<body>
  <div class="box">
    <p class="brand">67 <span class="n">TEEN</span></p>
    <h1>Le site est temporairement en maintenance.</h1>
    <p>On revient très vite. Merci de votre patience.</p>
    <p>Une question en attendant ? <a href="mailto:alexandre.chalon@gmail.com">alexandre.chalon@gmail.com</a></p>
  </div>
</body>
</html>
